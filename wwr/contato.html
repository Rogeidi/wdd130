<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale conosco</title>
    <meta name="description"
        content="Caso tenha alguma dúvida, não hesite em nos contatar; teremos prazer em ajudá-lo(a).">
    <meta name="author" content="Rogeidi Vela">
    <link rel="stylesheet" href="estilos/rafting.css">

</head>

<body>
    <header>
        <img src="imagens/logotipo-rafting.jpg" alt="Logotipo de Rafting">

        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <h1 class="contato">Rio Selvagem Rafting</h1>
        <p class="texto-endereco">Rua Fernando Camargo 710 <br>
            Americana, SP <br>
            +55 19 875475201<br>
            info@riosalvagem.com<br>
        </p>

        <section class="contato-bloco">
            <div class="map-info">
                <div class="map">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d17504.322613916695!2d-47.33194218749266!3d-22.734539357424104!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sbr!4v1780951958196!5m2!1ses-419!2sbr"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>

            </div>
            <div class="formulario">
                <form>
                    <div class="campo-grupo">
                        <label for="nome-completo">Nome</label>
                        <input type="text" id="nome-completo" name="nome-completo" required>
                    </div>
                    <div class="campo-grupo">
                        <label for="email-do-usuario">E-mail</label>
                        <input type="email" id="email-do-usuario" name="email-do-usuario" required>
                    </div>
                    <div class="campo-radio-grupo">
                        <p class="titulo-radio">Propósito da Mensagem</p>

                        <label class="proposito-mensagem">
                            <input type="radio" id="dúvida" name="proposito-mensagem" value="dúvida" checked>Dúvida
                            Geral
                        </label>

                        <label class="proposito-mensagem">
                            <input type="radio" id="pergunta" name="proposito-mensagem" value="pergunta">Pergunta sobre
                            Reserva
                        </label>

                        <label class="proposito-mensagem">
                            <input type="radio" id="sugestao" name="proposito-mensagem" value="sugestao">Sugestão
                        </label>
                    </div>
                    <div class="campo-grupo">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" placeholder="Mensagem"></textarea>

                    </div>
                    <div class="campo-checkbox">
                        <input type="checkbox" id="neswsletter" name="neswsletter">
                        <label for="neswsletter">Por Favor, me inscreva na newsletter mensal</label>
                    </div>

                    <button type="submit" class="btn-enviar">Entrar em contato!</button>
                </form>
            </div>
        </section>

        <section class="estamos aqui para servilo">
            <h2 class="equipe">Estamos Aqui para Servi-lo</h2>
            <div class="imagem-empleados">
                <figure class="imagem">
                    <img src="imagens/empleado-1.jpg" alt="Robert Halls">
                    <figcaption> Guia de Rafting</figcaption>
                </figure>

                <figure class="imagem">
                    <img src="imagens/empleado-2.jpg" alt="Rachel Weisz">
                    <figcaption>Coordenadora de Logística de Base</figcaption>
                </figure>

                <figure class="imagem">
                    <img src="imagens/empleado-3.jpg" alt="Harry Sierra">
                    <figcaption>Canoísta de Resgate</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 | Rio Selvagem Rafting | Rogeidi Vela | Americana, SP, Brasil</p>

        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/facebook-logo.png" alt="Ícone do facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="imagens/linkedin-logo.png" alt="Ícone do LinkedIn">
            </a>
            <a href="http://instagram.com">
                <img src="imagens/instagram-logo.png" alt="Ícone do Istagram">
            </a>
        </nav>
    </footer>


</body>

</html>
