<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header>


    </header>
    <main>
        <form>
            <fieldset>
                <legend>Informações de Contato</legend>
                <div class="item-formulario coluna2">
                    <label for=" nomecompleto">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome-completo" required><br></br>
                </div>
                <div class="item-formulario coluna2">
                    <label for="emaildousuario">E-mail</label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario" required><br></br>
                </div>
            </fieldset>
            <fieldset>
                <legend>Perguntas</legend>
                <div class="navegador coluna1">
                    <label for="navegador">Qual é o seu navegador de internet favorito?</label><br></br>
                    <select name="navegador" id="navegador">
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
                <div class="animal-de-estimação coluna1">
                    <label for="pet">Você tem um bichinho de estimação em casa?</label><br></br>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="lugares-onde-morou">
                    <label for="feedback">Liste os lugares onde você morou:</label>
                    <textarea id="feedback" name="feedback" rows="4"
                        placeholder="Barinas Venezuela, Barranquilla Colombia, Americana SP"></textarea><br></br>
                </div>
            </fieldset>
            <button type="submit">Enviar Pesquisa</button>
        </form>
    </main>
    <hr>
    <footer>
        ©2026 | Formulário HTML - Atividade de pesquisa de Usuário | Rogeidi Vela
    </footer>
</body>

</html>
